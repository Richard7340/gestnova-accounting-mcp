# Spain — Payroll legal pack for fiscal year 2026.
# Sources cited per rule.

- rule: irpf_brackets
  country: ES
  effective_from: 2026-01-01
  effective_until: null
  source: "Ley 35/2006 LIRPF Art. 63 — escala general 2026 (PGE 2026)"
  data:
    # State scale brackets (estatal). Most autonomous communities mirror,
    # full autonomous adjustment to be added per-CCAA in future work.
    - bracket: [0, 12450]
      rate: 0.19
    - bracket: [12450, 20200]
      rate: 0.24
    - bracket: [20200, 35200]
      rate: 0.30
    - bracket: [35200, 60000]
      rate: 0.37
    - bracket: [60000, 300000]
      rate: 0.45
    - bracket: [300000, null]
      rate: 0.47

- rule: irpf_personal_minimum
  country: ES
  effective_from: 2026-01-01
  effective_until: null
  source: "Art. 57 LIRPF"
  data:
    taxpayer: 5550
    children_first: 2400
    children_second: 2700
    children_third: 4000
    children_fourth_plus: 4500
    over_65: 1150
    over_75: 1400

