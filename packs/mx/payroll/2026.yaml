- rule: imss_employee_rates
  country: MX
  effective_from: 2026-01-01
  effective_until: null
  source: "Ley del Seguro Social Art. 25, 106, 107, 168 (cuotas obrero-patronales 2026)"
  data:
    # SIMPLIFIED total rate — full breakdown depends on SBC and UMA bands.
    # For Plan 3 we use an aggregated rate; precision via gestoría in Plan 5.
    enfermedades_maternidad: 0.00625
    invalidez_vida: 0.00625
    cesantia_vejez: 0.01125
    total: 0.02375
    notes: "Tasa simplificada empleado. Real depende de SBC + UMA — refinar en Plan 5 con datos AS-IS de gestoría."

