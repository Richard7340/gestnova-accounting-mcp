# México — Payroll legal pack for fiscal year 2026.
# Sources cited per rule.

- rule: isr_brackets
  country: MX
  effective_from: 2026-01-01
  effective_until: null
  source: "Art. 96 LISR — Tarifa mensual ISR 2026 (Anexo 8 RMF 2026)"
  data:
    # Mexican ISR uses (limite_inferior, limite_superior, cuota_fija, %_excedente)
    # Tax = cuota_fija + (income - limite_inferior) * pct_excedente
