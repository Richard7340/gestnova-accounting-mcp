- rule: exempt_concepts
  country: MX
  effective_from: 2026-01-01
  effective_until: null
  source: "Art. 93 LISR — Ingresos exentos"
  data:
    aguinaldo:
      exent_umas: 30
      notes: "30 UMAs anuales exentas. Excedente grava."
    prima_vacacional:
      exent_umas: 15
      notes: "15 UMAs exentas por año."
    prima_dominical:
      exent_umas_per_week: 1
      notes: "1 UMA por domingo trabajado, exenta."
    horas_extra:
      exent_min_wage_pct: 0.50
      notes: "50% exento hasta 5 UMAs por semana."
    despensa:
      exent_uma_pct: 0.40
      notes: "Hasta 40% UMA mensual exenta cuando se da vía monedero electrónico."
    fondo_ahorro:
      max_yearly_uma: 13
      max_employer_contrib_pct: 0.13
      notes: "Empresa puede dar hasta 13% del salario, máx 1.3 UMA anual exento."
