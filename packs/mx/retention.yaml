- rule: resico_rates
  country: MX
  effective_from: 2026-01-01
  effective_until: null
  source: "Capítulo II Sección IV LISR — RESICO (Régimen Simplificado de Confianza)"
  data:
    persona_fisica:
      - {limite_ingresos_anuales: 300000, tasa: 0.01}
      - {limite_ingresos_anuales: 600000, tasa: 0.011}
      - {limite_ingresos_anuales: 1000000, tasa: 0.015}
      - {limite_ingresos_anuales: 2500000, tasa: 0.02}
      - {limite_ingresos_anuales: 3500000, tasa: 0.025}
    notes: "RESICO permite tasas muy bajas a personas físicas con ingresos hasta 3.5M anuales. Sustituye ISR ordinario."
